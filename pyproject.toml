[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "order-ops-analytics"
version = "0.1.0"
description = "Validated order analytics and reproducible KPI dashboard"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest==9.2.0"]
[project.scripts]
order-ops = "order_ops.pipeline:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
